[package]
name = "sqlPlusExec"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["domi"]
description = "sqlplus executor, client/server mode."

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread", # #[tokio::main]
    "macros",          # #[tokio::main], select!, #[tokio::test]
    "net",             # Windows named pipes
    "process",         # the sqlplus child process
    "io-util",         # BufReader, read_until, split, write_all
    "sync",            # Mutex, Notify
    "time",            # sleep, timeout
] }
toml = "1.1.2"
chrono = "0.4"
encoding_rs = "0.8"
ratatui = "0.29"
# Only here to switch on crossterm's async EventStream (same version as ratatui's).
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
